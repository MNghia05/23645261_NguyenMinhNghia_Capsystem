openapi: 3.0.3

info:
  title: CAB System API
  description: API Documentation cho nền tảng đặt xe trực tuyến CAB System
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Local Development Server

tags:
  - name: Authentication
    description: API xác thực và quản lý tài khoản
  - name: Booking
    description: API đặt xe
  - name: Matching
    description: API ghép tài xế
  - name: Trip
    description: API quản lý chuyến đi
  - name: Tracking
    description: API theo dõi vị trí GPS
  - name: Payment
    description: API thanh toán
  - name: Rating
    description: API đánh giá chuyến đi
  - name: Driver
    description: API dành cho tài xế
  - name: Operations
    description: API dành cho nhân viên vận hành

paths:

  # ============================================================
  # AUTHENTICATION
  # ============================================================

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: Người dùng đăng nhập vào hệ thống bằng tài khoản và mật khẩu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Sai tài khoản hoặc mật khẩu

  # ============================================================
  # BOOKING
  # ============================================================

  /bookings:
    post:
      tags:
        - Booking
      summary: Tạo yêu cầu đặt xe
      description: Khách hàng tạo yêu cầu đặt xe với điểm đón, điểm đến và loại xe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Dữ liệu đặt xe không hợp lệ
        '409':
          description: Khách hàng đang có chuyến xe đang hoạt động

    get:
      tags:
        - Booking
      summary: Lấy danh sách đặt xe
      description: Lấy danh sách các yêu cầu đặt xe của khách hàng.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /bookings/{bookingId}:
    get:
      tags:
        - Booking
      summary: Xem thông tin đặt xe
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            example: 1001
      responses:
        '200':
          description: Thông tin đặt xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Không tìm thấy yêu cầu đặt xe

    delete:
      tags:
        - Booking
      summary: Hủy yêu cầu đặt xe
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Hủy đặt xe thành công
        '400':
          description: Không thể hủy yêu cầu đặt xe

  # ============================================================
  # MATCHING
  # ============================================================

  /bookings/{bookingId}/matching:
    post:
      tags:
        - Matching
      summary: Tìm tài xế phù hợp
      description: Hệ thống tìm tài xế đang AVAILABLE trong phạm vi phù hợp và gửi yêu cầu nhận chuyến.
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã tìm thấy tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResult'
        '404':
          description: Không tìm thấy tài xế phù hợp
        '408':
          description: Hết thời gian tìm tài xế

  /bookings/{bookingId}/accept:
    post:
      tags:
        - Matching
      summary: Tài xế nhận chuyến
      description: Tài xế xác nhận nhận yêu cầu đặt xe trong thời gian cho phép.
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tài xế nhận chuyến thành công
        '409':
          description: Yêu cầu đặt xe đã được tài xế khác nhận

  # ============================================================
  # TRIP
  # ============================================================

  /trips/{tripId}:
    get:
      tags:
        - Trip
      summary: Xem thông tin chuyến đi
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thông tin chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'

  /trips/{tripId}/status:
    put:
      tags:
        - Trip
      summary: Cập nhật trạng thái chuyến đi
      description: Cập nhật trạng thái theo vòng đời chuyến đi.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '400':
          description: Trạng thái không hợp lệ

  # ============================================================
  # TRACKING
  # ============================================================

  /trips/{tripId}/location:
    post:
      tags:
        - Tracking
      summary: Cập nhật vị trí tài xế
      description: Tài xế gửi vị trí GPS hiện tại trong quá trình thực hiện chuyến đi.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GPSLocation'
      responses:
        '200':
          description: Cập nhật vị trí thành công

  /trips/{tripId}/location:
    get:
      tags:
        - Tracking
      summary: Xem vị trí tài xế
      description: Khách hàng xem vị trí hiện tại của tài xế.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vị trí hiện tại của tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GPSLocation'

  # ============================================================
  # PAYMENT
  # ============================================================

  /payments:
    post:
      tags:
        - Payment
      summary: Thanh toán chuyến đi
      description: Thanh toán bằng tiền mặt hoặc phương thức thanh toán điện tử.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Thanh toán thất bại

  /payments/{paymentId}:
    get:
      tags:
        - Payment
      summary: Xem thông tin thanh toán
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thông tin thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  # ============================================================
  # RATING
  # ============================================================

  /ratings:
    post:
      tags:
        - Rating
      summary: Đánh giá chuyến đi
      description: Khách hàng đánh giá tài xế sau khi chuyến đi hoàn thành.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
        '400':
          description: Dữ liệu đánh giá không hợp lệ

  # ============================================================
  # DRIVER
  # ============================================================

  /drivers/profile:
    get:
      tags:
        - Driver
      summary: Xem hồ sơ tài xế
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin hồ sơ tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

  /drivers/status:
    put:
      tags:
        - Driver
      summary: Cập nhật trạng thái tài xế
      description: Tài xế chuyển trạng thái AVAILABLE hoặc UNAVAILABLE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - AVAILABLE
                    - UNAVAILABLE
                  example: AVAILABLE
      responses:
        '200':
          description: Cập nhật trạng thái thành công

  # ============================================================
  # OPERATIONS
  # ============================================================

  /drivers/{driverId}/approval:
    put:
      tags:
        - Operations
      summary: Phê duyệt hồ sơ tài xế
      description: Nhân viên vận hành kiểm tra và phê duyệt hồ sơ tài xế.
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverApprovalRequest'
      responses:
        '200':
          description: Phê duyệt hồ sơ thành công
        '400':
          description: Hồ sơ không hợp lệ

# ==============================================================
# COMPONENTS
# ==============================================================

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: customer01
        password:
          type: string
          format: password
          example: "123456"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1Ni...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600

    CreateBookingRequest:
      type: object
      required:
        - pickupLocation
        - destination
        - vehicleType
        - paymentMethod
      properties:
        pickupLocation:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
            - MOTORBIKE
            - CAR
          example: MOTORBIKE
        paymentMethod:
          type: string
          enum:
            - CASH
            - ELECTRONIC
          example: CASH

    Booking:
      type: object
      properties:
        bookingId:
          type: integer
          example: 1001
        customerId:
          type: integer
          example: 501
        pickupLocation:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: MOTORBIKE
        estimatedFare:
          type: number
          format: double
          example: 45000
        estimatedDistance:
          type: number
          format: double
          example: 5.2
        status:
          type: string
          enum:
            - PENDING
            - MATCHING
            - ACCEPTED
            - FAILED
            - CANCELLED
          example: PENDING
        createdAt:
          type: string
          format: date-time

    MatchingResult:
      type: object
      properties:
        bookingId:
          type: integer
          example: 1001
        driverId:
          type: integer
          example: 301
        distance:
          type: number
          format: double
          example: 1.5
        rating:
          type: number
          format: double
          example: 4.8
        status:
          type: string
          example: WAITING_FOR_ACCEPT

    Trip:
      type: object
      properties:
        tripId:
          type: integer
          example: 2001
        bookingId:
          type: integer
          example: 1001
        driverId:
          type: integer
          example: 301
        customerId:
          type: integer
          example: 501
        status:
          type: string
          enum:
            - ACCEPTED
            - ARRIVED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          example: IN_PROGRESS
        fare:
          type: number
          format: double
          example: 50000

    UpdateTripStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ARRIVED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          example: IN_PROGRESS

    GPSLocation:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.7769
        longitude:
          type: number
          format: double
          example: 106.7009
        timestamp:
          type: string
          format: date-time

    PaymentRequest:
      type: object
      required:
        - tripId
        - paymentMethod
      properties:
        tripId:
          type: integer
          example: 2001
        paymentMethod:
          type: string
          enum:
            - CASH
            - ELECTRONIC
          example: ELECTRONIC

    Payment:
      type: object
      properties:
        paymentId:
          type: integer
          example: 5001
        tripId:
          type: integer
          example: 2001
        amount:
          type: number
          format: double
          example: 50000
        paymentMethod:
          type: string
          enum:
            - CASH
            - ELECTRONIC
        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
          example: SUCCESS
        paidAt:
          type: string
          format: date-time

    RatingRequest:
      type: object
      required:
        - tripId
        - rating
      properties:
        tripId:
          type: integer
          example: 2001
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tài xế thân thiện, chạy xe an toàn.

    Driver:
      type: object
      properties:
        driverId:
          type: integer
          example: 301
        fullName:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: "0901234567"
        rating:
          type: number
          format: double
          example: 4.8
        status:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE
            - SUSPENDED
          example: AVAILABLE

    DriverApprovalRequest:
      type: object
      required:
        - approvalStatus
      properties:
        approvalStatus:
          type: string
          enum:
            - APPROVED
            - REJECTED
          example: APPROVED
        reason:
          type: string
          example: Hồ sơ hợp lệ.

    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        address:
          type: string
          example: 12 Nguyễn Huệ, Quận 1, TP.HCM
        latitude:
          type: number
          format: double
          example: 10.7769
        longitude:
          type: number
          format: double
          example: 106.7009
