openapi: 3.0.3
info:
  title: CAB System API - Authentication & Account
  version: 1.0.0
  description: API Document cho CAB System - Nền Tảng Đặt Xe Trực Tuyến.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Authentication & Account
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản bằng số điện thoại và OTP
      description: Đăng ký tài khoản bằng số điện thoại và OTP. Thuộc module Authentication & Account.
      tags:
      - Authentication & Account
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      security:
      - bearerAuth: []
  /auth/login:
    post:
      summary: Đăng nhập bằng số điện thoại và OTP
      description: Đăng nhập bằng số điện thoại và OTP. Thuộc module Authentication & Account.
      tags:
      - Authentication & Account
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      security:
      - bearerAuth: []
  /users/me:
    get:
      summary: Xem thông tin tài khoản hiện tại
      description: Xem thông tin tài khoản hiện tại. Thuộc module Authentication & Account.
      tags:
      - Authentication & Account
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      security:
      - bearerAuth: []
    put:
      summary: Cập nhật thông tin tài khoản hiện tại
      description: Cập nhật thông tin tài khoản hiện tại. Thuộc module Authentication & Account.
      tags:
      - Authentication & Account
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
