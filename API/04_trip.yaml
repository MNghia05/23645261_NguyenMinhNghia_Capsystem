openapi: 3.0.3
info:
  title: CAB System API - Trip Management
  version: 1.0.0
  description: API Document cho CAB System - Nền Tảng Đặt Xe Trực Tuyến.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Trip Management
paths:
  /trips/{tripId}:
    get:
      summary: Xem chi tiết chuyến đi
      description: >-
        Xem chi tiết chuyến đi, gồm trạng thái, thông tin tài xế và cước phí
        (totalFare chỉ có giá trị khi status = COMPLETED). Thuộc module Trip
        Management.
      tags:
      - Trip Management
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Chuyến đi không thuộc về người dùng này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
    put:
      summary: Cập nhật trạng thái chuyến đi
      description: |-
        Tài xế cập nhật trạng thái chuyến đi. Thuộc module Trip Management.
        Chỉ chấp nhận đi đúng thứ tự ACCEPTED -> ARRIVED -> IN_PROGRESS -> COMPLETED
        (xem States.md mục 2); nhảy bước hoặc cập nhật cho chuyến đã COMPLETED/
        CANCELLED đều bị từ chối (400). Khi chuyển COMPLETED, hệ thống tự động
        tính cước (module Pricing) - không có endpoint tính cước riêng.
      tags:
      - Trip Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: >-
            Giá trị trạng thái không hợp lệ, nhảy bước không đúng vòng đời,
            hoặc chuyến đã kết thúc (COMPLETED/CANCELLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tài xế không được phân công cho chuyến này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
  /trips/{tripId}/location:
    get:
      summary: Xem vị trí và hành trình hiện tại của chuyến đi
      description: Xem vị trí và hành trình hiện tại của chuyến đi. Thuộc module Trip
        Management.
      tags:
      - Trip Management
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLocation'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Chuyến đi không thuộc về người dùng này (dữ liệu vị trí phải được
            bảo vệ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
    post:
      summary: Tài xế gửi cập nhật vị trí GPS trong chuyến đi
      description: >-
        Tài xế gửi cập nhật vị trí GPS trong chuyến đi. Thuộc module Trip
        Management. Từ chối nếu chuyến đã COMPLETED/CANCELLED.
      tags:
      - Trip Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoPoint'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLocation'
        '400':
          description: Tọa độ không hợp lệ, hoặc chuyến đã kết thúc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tài xế không thuộc chuyến đi này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
  /trips/{tripId}/sos:
    post:
      summary: Gửi yêu cầu hỗ trợ khẩn cấp (SOS)
      description: >-
        Khách hàng hoặc tài xế gửi yêu cầu hỗ trợ khẩn cấp kèm vị trí hiện
        tại. Thuộc module Trip Management. Tạo một Incident (xem
        07_operations.yaml, States.md mục 5). Vẫn tạo được yêu cầu ngay cả
        khi không lấy được vị trí (location sẽ là null).
      tags:
      - Trip Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SosRequest'
      responses:
        '200':
          description: Yêu cầu SOS đã được tạo và gửi cho nhân viên vận hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SosResponse'
        '400':
          description: Chuyến đi không ở trạng thái đang diễn ra (không có chuyến để gửi SOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Chuyến đi không thuộc về người dùng này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TripStatus:
      type: string
      enum: [ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
      description: Xem State Machine đầy đủ (thứ tự chuyển đổi bắt buộc) ở States.md mục 2.
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    UpdateTripStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TripStatus'
    Trip:
      type: object
      properties:
        tripId:
          type: string
        bookingId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        pickup:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/GeoPoint'
        status:
          $ref: '#/components/schemas/TripStatus'
        totalFare:
          type: number
          nullable: true
          description: Chỉ có giá trị sau khi status = COMPLETED. Không đổi dù bảng giá
            thay đổi sau đó (States.md mục 2; xem UC05 trong README).
        createdAt:
          type: string
          format: date-time
    TripLocation:
      type: object
      properties:
        tripId:
          type: string
        currentLocation:
          $ref: '#/components/schemas/GeoPoint'
        estimatedArrival:
          type: string
          format: date-time
          nullable: true
        available:
          type: boolean
          description: false nếu chưa nhận được vị trí tài xế (TC-UC07-EXC-001).
    SosRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        note:
          type: string
    SosResponse:
      type: object
      properties:
        incidentId:
          type: string
        tripId:
          type: string
        status:
          type: string
          enum: [NEW]
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
