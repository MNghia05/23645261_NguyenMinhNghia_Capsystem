openapi: 3.0.3
info:
  title: CAB System API - Trip Management
  version: 1.0.0
  description: API Document cho CAB System - Nền Tảng Đặt Xe Trực Tuyến.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Trip Management
paths:
  /trips/{tripId}:
    get:
      summary: Xem chi tiết chuyến đi
      description: Xem chi tiết chuyến đi. Thuộc module Trip Management.
      tags:
      - Trip Management
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
    put:
      summary: Cập nhật trạng thái chuyến đi
      description: Cập nhật trạng thái chuyến đi. Thuộc module Trip Management.
      tags:
      - Trip Management
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
  /trips/{tripId}/location:
    get:
      summary: Xem vị trí và hành trình hiện tại của chuyến đi
      description: Xem vị trí và hành trình hiện tại của chuyến đi. Thuộc module Trip Management.
      tags:
      - Trip Management
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
    post:
      summary: Tài xế gửi cập nhật vị trí GPS trong chuyến đi
      description: Tài xế gửi cập nhật vị trí GPS trong chuyến đi. Thuộc module Trip Management.
      tags:
      - Trip Management
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
  /trips/{tripId}/sos:
    post:
      summary: Gửi yêu cầu hỗ trợ khẩn cấp (SOS)
      description: Khách hàng hoặc tài xế gửi yêu cầu hỗ trợ khẩn cấp kèm vị trí hiện tại. Thuộc module Trip Management.
      tags:
      - Trip Management
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
