openapi: 3.0.3
info:
  title: CAB System API - Rating & Feedback
  version: 1.0.0
  description: API Document cho CAB System - Nền Tảng Đặt Xe Trực Tuyến.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Rating & Feedback
paths:
  /ratings:
    post:
      summary: Đánh giá chuyến đi/tài xế
      description: Đánh giá chuyến đi/tài xế. Thuộc module Rating & Feedback.
      tags:
      - Rating & Feedback
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thực hiện
        '404':
          description: Không tìm thấy tài nguyên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
